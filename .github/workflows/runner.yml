name: Automated Task Runner

on:
  schedule:
    # Runs every 2 hours 40 minutes (9 times a day = 100% safe for 6-hour cookies)
    - cron: '0 0,8,16 * * *'
    - cron: '40 2,10,18 * * *'
    - cron: '20 5,13,21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Cache Binary Packages
        id: cache-openvpn
        uses: actions/cache@v4
        with:
          path: ~/openvpn-debs
          key: ${{ runner.os }}-openvpn-debs-v2

      - name: Run Task Script
        run: bash run_all.sh
